# In-container nginx for PasteWorks.
#
# The whole app is one static bundle: no API, no database, no sign-in. The host
# nginx proxies "/" here and owns TLS.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        # Vite emits content-hashed filenames here, so they never change in place.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry point - it references the hashed bundles, and a
    # stale copy keeps people on old code long after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A one-line health endpoint so redeploy.sh has something to poll.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
