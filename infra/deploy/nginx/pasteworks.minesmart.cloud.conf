# Host nginx site for PasteWorks (pasteworks.minesmart.cloud).
#
#   web (static)   127.0.0.1:8480   <- "/"
#
# There is no /api and no identity here. PasteWorks is open to anyone with the
# link on purpose - it holds nothing and writes nothing.
#
# Install as HTTP first, then let certbot add TLS and the redirect:
#   sudo cp pasteworks.minesmart.cloud.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/pasteworks.minesmart.cloud.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pasteworks.minesmart.cloud

server {
    listen 80;
    listen [::]:80;
    server_name pasteworks.minesmart.cloud;

    location / {
        proxy_pass http://127.0.0.1:8480/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
