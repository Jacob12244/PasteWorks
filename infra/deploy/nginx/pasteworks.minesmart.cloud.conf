# Host nginx site for PasteWorks (pasteworks.minesmart.cloud).
#
#   web (static)       127.0.0.1:8480   <- "/"
#   arena (Paste Wars) 127.0.0.1:8481   <- "/play" (WebSocket) and "/play/status"
#
# There is no /api and no identity here. PasteWorks is open to anyone with the
# link on purpose - the page holds nothing, and the arena holds one game in
# memory and nothing else.
#
# Install as HTTP first, then let certbot add TLS and the redirect:
#   sudo cp pasteworks.minesmart.cloud.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/pasteworks.minesmart.cloud.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pasteworks.minesmart.cloud
#
# Already installed and certbotted? Do not copy this over the live file - it
# would drop the TLS block certbot wrote. Add the map and the two /play
# locations to the live file by hand instead (infra/deploy/README.md).

# A WebSocket needs "Connection: upgrade"; a plain request must not get it.
# Named for this site, so it cannot collide with a map in another vhost.
map $http_upgrade $pasteworks_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pasteworks.minesmart.cloud;

    location / {
        proxy_pass http://127.0.0.1:8480/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Paste Wars. The arena reads X-Real-IP for its per-address limits, and a
    # game can sit quiet for longer than nginx's default minute.
    location = /play {
        proxy_pass http://127.0.0.1:8481;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pasteworks_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /play/status {
        proxy_pass http://127.0.0.1:8481;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
