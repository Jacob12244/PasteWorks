<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230b111b%22%2F%3E%3Cpath%20d%3D%22M11%208h10l4%2014H7z%22%20fill%3D%22%23c08f52%22%2F%3E%3Cpath%20d%3D%22M5%2025h22%22%20stroke%3D%22%2335e0d0%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>PasteWorks</title>
<style>
  :root {
    --bg: #070a10;
    --panel: rgba(9, 14, 22, 0.84);
    --panel-solid: #0b1018;
    --line: rgba(53, 224, 208, 0.22);
    --line-soft: rgba(139, 155, 176, 0.18);
    --txt: #e2e9f4;
    --muted: #8b9bb0;
    --cyan: #35e0d0;
    --amber: #ffab3d;
    --lime: #9fe870;
    --red: #ff5a3c;
    --paste: #d9a068;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
    /* the scenario's own colour; set on start */
    --accent: #35e0d0;
    --sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--txt);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  canvas#view { position: fixed; inset: 0; display: block; }

  #ui {
    position: fixed; inset: 0; pointer-events: none;
    display: grid;
    grid-template-columns: 340px 1fr 320px;
    grid-template-rows: auto 1fr auto;
    gap: 14px; padding: 14px;
  }
  #ui > * { pointer-events: auto; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
  }

  .panel h2 {
    margin: 0; padding: 9px 13px;
    font-size: 10.5px; letter-spacing: .17em; text-transform: uppercase;
    color: var(--cyan); font-weight: 700;
    border-bottom: 1px solid var(--line-soft);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel .body { padding: 11px 13px; }

  /* ---------------- masthead ---------------- */
  #mast { grid-column: 1; grid-row: 1; }
  #mast .title {
    padding: 12px 13px 6px; display: flex; align-items: baseline; gap: 9px;
  }
  #mast .title b {
    font-size: 19px; letter-spacing: .05em; font-weight: 800;
    background: linear-gradient(92deg, var(--cyan), var(--paste));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #mast .world {
    padding: 0 13px 7px; font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #mast .title .leave {
    margin-left: auto; padding: 3px 9px; font-size: 9.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);
  }
  #mast .title .leave:hover { color: var(--accent); border-color: var(--accent); }
  #mast .sub { padding: 0 13px 11px; font-size: 11.5px; color: var(--muted); line-height: 1.45; }

  .goal { padding: 0 13px 12px; }
  .goal .row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; }
  .goal .row b { font-family: var(--mono); font-size: 13px; color: var(--txt); }
  .bar { height: 9px; border-radius: 5px; background: #121a25; overflow: hidden; border: 1px solid var(--line-soft); }
  .bar > i { display: block; height: 100%; border-radius: 4px; transition: width .25s ease; }

  /* ---------------- time / run ---------------- */
  #timebar { grid-column: 3; grid-row: 1; }
  #timebar .body { display: grid; gap: 9px; }
  .clock { font-family: var(--mono); font-size: 25px; text-align: center; letter-spacing: .04em; }
  .clock small { display:block; font-size: 10px; color: var(--muted); letter-spacing: .16em; margin-top: 2px; }
  .speeds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }

  button {
    font-family: var(--sans); font-size: 11px; font-weight: 600;
    color: var(--txt); background: #141c27;
    border: 1px solid var(--line-soft); border-radius: 7px;
    padding: 7px 6px; cursor: pointer; transition: .14s;
    letter-spacing: .04em;
  }
  button:hover { background: #1c2836; border-color: var(--line); }
  button.on { background: rgba(53,224,208,.16); border-color: var(--cyan); color: var(--cyan); }
  button.run { background: rgba(159,232,112,.14); border-color: var(--lime); color: var(--lime); font-size: 13px; padding: 10px; }
  button.stop { background: rgba(255,90,60,.14); border-color: var(--red); color: var(--red); font-size: 13px; padding: 10px; }
  button.warn { background: rgba(255,171,61,.15); border-color: var(--amber); color: var(--amber); }
  button:disabled { opacity: .35; cursor: default; }

  /* ---------------- console ---------------- */
  /* Spans rows 2 and 3 so the inspector opening in row 3 cannot steal its
     height. Rows 2 + 3 always add up to the same thing, so the console is
     the same size whether or not a unit is selected. */
  #console { grid-column: 3; grid-row: 2 / 4; overflow-y: auto; min-height: 0; }
  #console::-webkit-scrollbar { width: 7px; }
  #console::-webkit-scrollbar-thumb { background: #22303f; border-radius: 4px; }

  .ctl { margin-bottom: 13px; }
  .ctl:last-child { margin-bottom: 4px; }
  .ctl .lab {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10.5px; color: var(--muted); letter-spacing: .07em;
    text-transform: uppercase; margin-bottom: 5px;
  }
  .ctl .lab b { font-family: var(--mono); font-size: 14px; color: var(--txt); letter-spacing: 0; }
  .ctl .hint { font-size: 10px; color: #6d7c90; margin-top: 4px; line-height: 1.4; }
  .ctl.flag .lab b { color: var(--amber); }

  .sect {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--cyan); font-weight: 700;
    margin: 2px 0 11px; padding-bottom: 6px;
    border-bottom: 1px solid var(--line-soft);
  }
  .sect em {
    font-style: normal; font-size: 9.5px; color: var(--muted);
    letter-spacing: .05em; text-transform: none; font-weight: 500;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, var(--cyan) var(--pct, 50%), #1a2330 var(--pct, 50%));
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: #e8f6ff; border: 2px solid var(--cyan);
    box-shadow: 0 0 9px rgba(53,224,208,.6); cursor: grab;
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: #e8f6ff; border: 2px solid var(--cyan); cursor: grab;
  }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }

  /* ---------------- alarms ---------------- */
  #alarms { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; min-height: 60px; }
  #alarms .body { overflow-y: auto; padding: 6px 8px; flex: 1; }
  #alarms .body::-webkit-scrollbar { width: 7px; }
  #alarms .body::-webkit-scrollbar-thumb { background: #22303f; border-radius: 4px; }
  .al { display: flex; gap: 8px; padding: 5px 6px; border-radius: 6px; font-size: 11px; line-height: 1.35; }
  .al + .al { margin-top: 2px; }
  .al time { font-family: var(--mono); font-size: 10px; color: var(--muted); flex: 0 0 46px; }
  .al.info { color: #b6c6d8; }
  .al.warn { color: var(--amber); background: rgba(255,171,61,.07); }
  .al.trip { color: var(--red); background: rgba(255,90,60,.11); font-weight: 600; }

  /* ---------------- inspector ---------------- */
  #inspect { grid-column: 1; grid-row: 3; max-height: 46vh; overflow-y: auto; }
  #inspect.hidden { display: none; }
  #inspect .body { padding: 8px 13px 12px; }
  #inspect table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  #inspect td { padding: 3.5px 0; border-bottom: 1px solid rgba(139,155,176,.09); }
  #inspect td:first-child { color: var(--muted); }
  #inspect td:last-child { text-align: right; font-family: var(--mono); }
  #inspect .note {
    margin-top: 9px; padding: 7px 9px; border-radius: 7px; font-size: 10.5px;
    line-height: 1.5; color: #9fb0c4; background: rgba(53,224,208,.06);
    border-left: 2px solid var(--cyan);
  }
  .x { cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; }
  .x:hover { color: var(--txt); }

  /* ---------------- kpis ---------------- */
  #kpis {
    grid-column: 2; grid-row: 3; justify-self: center; align-self: end;
    display: flex; gap: 1px; overflow: hidden;
  }
  #kpis .k { padding: 8px 15px; text-align: center; background: var(--panel); }
  #kpis .k:first-child { border-radius: 12px 0 0 12px; }
  #kpis .k:last-child { border-radius: 0 12px 12px 0; }
  #kpis .k em {
    display: block; font-style: normal; font-size: 9.5px;
    color: var(--muted); letter-spacing: .13em; text-transform: uppercase;
  }
  #kpis .k b { font-family: var(--mono); font-size: 16px; font-weight: 700; }
  #kpis .k.ok b { color: var(--lime); }
  #kpis .k.warn b { color: var(--amber); }
  #kpis .k.bad b { color: var(--red); }

  /* ---------------- misc ---------------- */
  #hint {
    grid-column: 2; grid-row: 1; justify-self: center; align-self: start;
    font-size: 11px; color: var(--muted); padding: 7px 14px;
    background: var(--panel); border: 1px solid var(--line-soft); border-radius: 20px;
  }
  .walk { width: 100%; margin-top: 7px; }
  .walk kbd {
    font-family: var(--mono); font-size: 10px; background: #1a2532;
    border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 5px; margin-left: 4px;
  }
  #hint kbd {
    font-family: var(--mono); font-size: 10px; background: #1a2532;
    border: 1px solid var(--line-soft); border-radius: 4px; padding: 1px 5px; margin: 0 2px;
  }

  #banner {
    position: fixed; left: 50%; top: 44%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; opacity: 0; transition: opacity .4s;
  }
  #banner.show { opacity: 1; }
  #banner b { display: block; font-size: 42px; font-weight: 800; letter-spacing: .04em; }
  #banner span { font-size: 13px; color: var(--muted); }

  @media (max-width: 1180px) {
    #ui { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
    #mast, #timebar, #console, #alarms, #inspect, #kpis, #hint { grid-column: 1; }
    #console { grid-row: auto; }
    #alarms, #hint { display: none; }
  }

  /* ================= control room: the SCADA video wall ================= */
  /* The whole overlay is transparent except for the screens and the joinery,
     so the plant keeps rendering behind it - out of the window above, and
     faintly through the glass of the monitors themselves. */

  #scada { position: fixed; inset: 0; display: none; }
  #scada.on {
    display: grid;
    grid-template-rows: 26vh minmax(0, 1fr) auto;
    /* turn far enough and the wall translates clean off the side of the
       viewport; it must not become something the page can scroll to */
    overflow: hidden;
    cursor: grab;
    /* a look-around drag must never start selecting the labels it passes over */
    user-select: none; -webkit-user-select: none;
  }
  #scada.dragging, #scada.dragging * { cursor: grabbing !important; }
  #scada input, #scada button { cursor: pointer; }
  #scada input[type=range] { cursor: ew-resize; }

  /* ---- the window band ---- */
  /* No painted frame: the camera sits inside the room, so the glass, the
     mullions and the sill in front of it are all real geometry. */
  .sc-win { position: relative; }
  .sc-hint {
    font-size: 9.5px; letter-spacing: .14em; color: #55637a;
    border: 1px dashed rgba(139,155,176,.3); border-radius: 12px;
    padding: 3px 9px;
  }
  .sc-centre { letter-spacing: .12em; font-size: 10px; }
  .sc-lintel {
    position: relative; z-index: 3;
    display: flex; align-items: center; gap: 14px;
    padding: 7px 16px;
    background: linear-gradient(180deg, #0c131c, rgba(12,19,28,.86));
    border-bottom: 1px solid var(--line);
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted);
  }
  .sc-lintel .sc-where b { color: var(--cyan); letter-spacing: .1em; }
  .sc-clock {
    margin-left: auto; font-family: var(--mono); font-size: 15px;
    color: var(--txt); letter-spacing: .04em; text-transform: none;
  }
  .sc-clock em { font-style: normal; font-size: 9.5px; color: var(--muted); margin-left: 8px; }
  .sc-exit {
    letter-spacing: .12em; font-size: 10px;
    border-color: var(--line); color: var(--cyan);
    background: rgba(53,224,208,.1);
  }

  /* ---- the four screens ---- */
  .sc-wall {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; min-height: 0; gap: 9px;
    padding: 12px 4vw 10px;
    will-change: transform;
  }
  .sc-grid {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr;
    grid-auto-rows: minmax(0, 1fr); gap: 14px;
  }
  /* margin-top:auto keeps the tray on the desk edge even when every screen
     is minimised and the grid above it has collapsed to nothing */
  .sc-tray { display: flex; gap: 7px; flex-wrap: wrap; margin-top: auto; }
  .sc-pill {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 12px; font-size: 9.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted);
    background: rgba(7,12,18,.94);
    border: 1px solid rgba(53,224,208,.26); border-radius: 6px;
  }
  .sc-pill:hover { color: var(--txt); border-color: var(--cyan); }
  .sc-pill b {
    font-family: var(--mono); color: #0a0e15; background: var(--muted);
    border-radius: 3px; padding: 1px 5px; font-size: 9px; letter-spacing: .08em;
  }
  .sc-pill:hover b { background: var(--cyan); }
  .sc-screen {
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
    background: rgba(7, 12, 18, 0.94);
    border: 1px solid rgba(53,224,208,.26);
    border-radius: 7px;
    box-shadow:
      0 0 0 5px #0a0e15,
      0 0 0 6px rgba(120,140,165,.16),
      0 16px 44px rgba(0,0,0,.72),
      inset 0 0 70px rgba(53,224,208,.045);
  }
  .sc-head {
    display: flex; align-items: center; gap: 9px;
    padding: 5px 10px; flex: 0 0 auto;
    border-bottom: 1px solid rgba(139,155,176,.16);
    font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--muted);
  }
  .sc-head b {
    font-family: var(--mono); color: #0a0e15; background: var(--cyan);
    border-radius: 3px; padding: 1px 5px; font-size: 9px; letter-spacing: .08em;
  }
  .sc-winbtns { margin-left: auto; display: flex; gap: 4px; }
  .sc-wb {
    position: relative; width: 20px; height: 17px; padding: 0;
    border-radius: 4px; color: var(--muted);
    background: rgba(255,255,255,.03); border: 1px solid rgba(139,155,176,.18);
  }
  .sc-wb:hover { color: var(--cyan); border-color: var(--cyan); background: rgba(53,224,208,.12); }
  .sc-wb.min::after {
    content: ''; position: absolute; left: 4px; right: 4px; bottom: 4px;
    height: 1.5px; background: currentColor;
  }
  .sc-wb.max::after {
    content: ''; position: absolute; inset: 4px; border: 1.5px solid currentColor;
    border-radius: 1px;
  }
  .sc-screen.big .sc-wb.max::after { inset: 5px 3px 3px 5px; }
  .sc-screen.big .sc-wb.max::before {
    content: ''; position: absolute; left: 3px; top: 3px; width: 9px; height: 9px;
    border: 1.5px solid currentColor; opacity: .45;
  }
  .sc-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px 10px; }
  .sc-body::-webkit-scrollbar { width: 6px; }
  .sc-body::-webkit-scrollbar-thumb { background: #22303f; border-radius: 3px; }

  /* 01 mimic */
  .sc-mimic { display: flex; padding: 6px; }
  .sc-mimic svg { width: 100%; height: 100%; }

  /* 02 setpoints */
  .sc-sect {
    font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--cyan); font-weight: 700;
    margin: 4px 0 7px; padding-bottom: 4px;
    border-bottom: 1px solid rgba(139,155,176,.16);
  }
  .sc-sp {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 0 16px; align-content: start;
  }
  .sc-sp > .sc-sect, .sc-sp > .sc-toggles { grid-column: 1 / -1; }
  .sc-ctl { margin-bottom: 9px; }
  .sc-lab {
    display: flex; align-items: baseline; gap: 7px;
    font-size: 10px; color: var(--muted); margin-bottom: 3px;
  }
  .sc-lab em {
    font-style: normal; font-family: var(--mono); font-size: 9px;
    color: var(--cyan); background: rgba(53,224,208,.1);
    border: 1px solid rgba(53,224,208,.22); border-radius: 3px; padding: 0 4px;
  }
  .sc-lab b {
    margin-left: auto; font-family: var(--mono); font-size: 12.5px; color: var(--txt);
  }
  .sc-ctl input[type=range] { height: 4px; }
  .sc-toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 2px 0 4px; }
  .sc-toggles button { padding: 5px 4px; font-size: 10px; }

  /* 00 the warnings banner */
  /* One screen the width of two, mounted above the working screens. Shallow
     on purpose: it is read with a glance upward, not stared at. */
  .sc-warnbar {
    flex: 0 0 auto;
    display: flex; flex-direction: column;
    background: rgba(7,12,18,.94);
    border: 1px solid rgba(53,224,208,.26);
    border-radius: 7px;
    box-shadow:
      0 0 0 5px #0a0e15,
      0 0 0 6px rgba(120,140,165,.16),
      0 14px 34px rgba(0,0,0,.7),
      inset 0 0 70px rgba(53,224,208,.045);
  }
  .sc-warnbar.warn { border-color: rgba(255,171,61,.5); }
  .sc-warnbar.trip { border-color: rgba(255,90,60,.7); }
  .sc-warnbar.win { border-color: rgba(159,232,112,.7); }
  .sc-warnbar.win .sc-wcount { color: var(--lime); font-weight: 700; }
  .sc-warnbar .sc-head { font-size: 10px; }
  .sc-wcount {
    margin-left: auto; font-style: normal; font-family: var(--mono);
    font-size: 10.5px; letter-spacing: .14em; color: #54627a;
  }
  .sc-warnbar.warn .sc-wcount { color: var(--amber); }
  .sc-warnbar.trip .sc-wcount {
    color: var(--red); font-weight: 700;
    animation: blink .6s steps(1) infinite;
  }
  /* sc-wcount already took the auto margin; keep the button beside it */
  .sc-warnbar .sc-winbtns { margin-left: 12px; }
  .sc-wbody { display: flex; gap: 14px; padding: 7px 10px 9px; min-height: 0; }
  .sc-warnbar.mini .sc-wbody { display: none; }
  .sc-lamps {
    flex: 1 1 auto; align-content: start;
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 3px;
  }
  .sc-wlog { flex: 0 0 290px; display: flex; flex-direction: column; min-height: 0; }
  .sc-wlog .sc-sect { flex: 0 0 auto; margin: 0 0 4px; }
  .sc-events { flex: 1 1 auto; min-height: 0; max-height: 72px; overflow-y: auto; }
  .sc-events::-webkit-scrollbar { width: 6px; }
  .sc-events::-webkit-scrollbar-thumb { background: #22303f; border-radius: 3px; }
  .sc-lamp {
    padding: 4px 4px; border-radius: 4px; text-align: center;
    font-size: 8.5px; line-height: 1.2; letter-spacing: .05em;
    color: #46536a; background: #0d131b;
    border: 1px solid rgba(139,155,176,.12);
    min-height: 26px; display: flex; align-items: center; justify-content: center;
  }
  .sc-lamp.on.info { color: var(--cyan); border-color: var(--cyan); background: rgba(53,224,208,.12); }
  .sc-lamp.on.warn {
    color: #0a0e15; background: var(--amber); border-color: var(--amber);
    font-weight: 700; animation: blink 1.1s steps(1) infinite;
  }
  .sc-lamp.on.trip {
    color: #fff; background: var(--red); border-color: var(--red);
    font-weight: 700; animation: blink 0.5s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: .22; } }

  .sc-ev { display: flex; gap: 7px; padding: 3px 4px; border-radius: 4px; font-size: 10px; line-height: 1.3; }
  .sc-ev time { font-family: var(--mono); font-size: 9px; color: var(--muted); flex: 0 0 34px; }
  .sc-ev.info { color: #97a8bd; }
  .sc-ev.warn { color: var(--amber); background: rgba(255,171,61,.07); }
  .sc-ev.trip { color: var(--red); background: rgba(255,90,60,.12); font-weight: 600; }

  /* 04 trends */
  .sc-trend { padding: 6px 8px; overflow: hidden; }
  .sc-trend canvas { display: block; width: 100%; height: 100%; }

  /* ---- the desk ---- */
  /* Above the wall: the wall slides under it when you look up, and the run
     and stop buttons must never end up behind a screen. */
  .sc-desk {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 6vw 12px;
    background: linear-gradient(180deg, rgba(10,15,22,.55), #0a0f16 34%);
    border-top: 1px solid rgba(120,140,165,.2);
  }
  .sc-desk button { padding: 8px 12px; }
  .sc-desk .run, .sc-desk .stop { font-size: 12px; min-width: 168px; }

  /* the phone: how consumables actually get ordered from the chair */
  .sc-phone {
    display: flex; align-items: stretch; gap: 6px;
    padding: 4px 6px 4px 9px; border-radius: 7px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(139,155,176,.2);
  }
  .sc-phone.ring { border-color: var(--amber); background: rgba(255,171,61,.09); }
  /* a handset drawn from two borders, so it does not depend on a font glyph */
  .sc-ph-icon {
    position: relative; flex: 0 0 17px; width: 17px; height: 15px;
    align-self: center; color: #6d7c90;
  }
  .sc-phone.ring .sc-ph-icon { color: var(--amber); animation: blink .5s steps(1) infinite; }
  .sc-ph-icon::before {
    content: ''; position: absolute; left: 0; right: 0; top: 1px; height: 6px;
    border: 2px solid currentColor; border-bottom: 0; border-radius: 8px 8px 0 0;
  }
  .sc-ph-icon::after {
    content: ''; position: absolute; left: 1px; right: 1px; top: 9px; height: 3px;
    background: currentColor; border-radius: 2px; transform: rotate(-16deg);
  }
  .sc-ph-lab {
    align-self: center; font-size: 7.5px; line-height: 1.2;
    letter-spacing: .13em; color: #54627a;
  }
  .sc-desk .sc-ph-btn {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 3px 10px; min-width: 66px;
    font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase;
  }
  .sc-desk .sc-ph-btn b {
    font-family: var(--mono); font-size: 12.5px; letter-spacing: 0;
    color: var(--txt); text-transform: none;
  }
  .sc-desk .sc-ph-btn:disabled b { color: inherit; }
  .sc-speeds { display: flex; gap: 4px; }
  .sc-speeds button { min-width: 46px; }
  .sc-strip { margin-left: auto; display: flex; gap: 8px; }
  .sc-pilot {
    display: flex; align-items: center; gap: 6px;
    font-size: 9px; letter-spacing: .14em; color: #46536a;
  }
  .sc-pilot i {
    width: 10px; height: 10px; border-radius: 50%;
    background: #18202b; border: 1px solid rgba(139,155,176,.25);
  }
  .sc-pilot.on.lime { color: var(--lime); }
  .sc-pilot.on.lime i { background: var(--lime); box-shadow: 0 0 10px var(--lime); border-color: var(--lime); }
  .sc-pilot.on.red { color: var(--red); }
  .sc-pilot.on.red i {
    background: var(--red); box-shadow: 0 0 12px var(--red); border-color: var(--red);
    animation: blink .55s steps(1) infinite;
  }

  @media (max-height: 760px) {
    #scada.on { grid-template-rows: 19vh minmax(0, 1fr) auto; }
    .sc-lamp { font-size: 8px; min-height: 24px; padding: 3px; }
    .sc-events { max-height: 52px; }
  }
  @media (max-width: 1240px) {
    .sc-wlog { display: none; }
    .sc-lamps { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  }

  /* ================================================================ welcome */
  #welcome {
    position: fixed; inset: 0; z-index: 50; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 6vh 4vw 3vh; gap: 4vh;
    background:
      radial-gradient(120% 80% at 50% 0%, #102033 0%, #070a10 60%),
      #070a10;
    opacity: 0; transition: opacity .6s ease;
  }
  #welcome.on { opacity: 1; }
  #welcome.leaving { opacity: 0; transition-duration: .5s; }
  .wl-bg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #welcome header { position: relative; text-align: center; max-width: 900px; }
  .wl-mark {
    font-size: 13px; letter-spacing: .5em; color: var(--muted); font-weight: 600;
    margin-bottom: 18px;
  }
  .wl-mark b { color: var(--cyan); font-weight: 800; }
  #welcome h1 {
    margin: 0 0 14px; font-weight: 300; font-size: clamp(22px, 3vw, 38px);
    line-height: 1.18; letter-spacing: -.01em; color: #f1f5fb;
  }
  #welcome header p {
    margin: 0 auto; max-width: 640px; font-size: 14px; line-height: 1.6; color: var(--muted);
  }
  .wl-cards {
    position: relative; width: 100%; max-width: 1560px;
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px;
  }
  @media (max-width: 1250px) { .wl-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .wl-cards { grid-template-columns: 1fr; } }
  .wl-card {
    all: unset; box-sizing: border-box; cursor: pointer;
    display: flex; flex-direction: column; overflow: hidden;
    background: rgba(10, 15, 23, .86);
    border: 1px solid rgba(139,155,176,.18); border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .wl-card:hover, .wl-card:focus-visible {
    transform: translateY(-6px);
    border-color: var(--acc);
    box-shadow: 0 22px 60px rgba(0,0,0,.6), 0 0 0 1px var(--acc), 0 0 40px -8px var(--acc);
  }
  .wl-art { aspect-ratio: 16 / 9; overflow: hidden; border-bottom: 1px solid rgba(139,155,176,.14); }
  .wl-art svg { display: block; width: 100%; height: 100%; transition: transform .6s ease; }
  .wl-card:hover .wl-art svg { transform: scale(1.05); }
  .wl-body { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px 16px; flex: 1; }
  .wl-body em {
    font-style: normal; font-family: var(--mono); font-size: 11px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--acc);
  }
  .wl-body b { font-size: 18px; font-weight: 650; color: #f1f5fb; letter-spacing: -.005em; }
  .wl-body i { font-style: normal; font-size: 11.5px; color: var(--muted); letter-spacing: .03em; }
  .wl-body p { margin: 8px 0 4px; font-size: 12.5px; line-height: 1.5; color: #b7c3d4; }
  .wl-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 8px; }
  .wl-chips span {
    font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 4px;
    color: #c8d3e2; background: rgba(255,255,255,.05); border: 1px solid rgba(139,155,176,.16);
  }
  .wl-go {
    margin-top: 12px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--muted); transition: color .2s ease;
  }
  .wl-card:hover .wl-go { color: var(--acc); }
  /* Paste Wars: a strip under the worlds, in the arena's hi-vis orange, with a door for each map */
  .wl-arena {
    position: relative; box-sizing: border-box; width: 100%; max-width: 1560px; margin-top: -1vh;
    display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; align-items: center; gap: 8px 22px;
    padding: 12px 14px 12px 22px; color: var(--txt);
    background: linear-gradient(90deg, rgba(255,122,26,.13), rgba(10,15,23,.86) 40%);
    border: 1px solid rgba(255,122,26,.32); border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
  }
  .wl-arena svg { width: 40px; height: 40px; }
  .wa-name { display: flex; flex-direction: column; gap: 3px; }
  .wa-name em {
    font-style: normal; font-family: var(--mono); font-size: 11px;
    letter-spacing: .18em; text-transform: uppercase; color: #ff7a1a;
  }
  .wa-name b { font-size: 18px; font-weight: 700; letter-spacing: .28em; color: #f1f5fb; white-space: nowrap; }
  .wa-text { font-size: 12.5px; line-height: 1.5; color: #b7c3d4; }
  .wa-door {
    display: grid; grid-template-columns: auto auto; align-items: baseline; align-self: stretch; gap: 2px 16px; min-width: 210px;
    padding: 10px 14px; text-decoration: none; color: var(--txt); border-radius: 10px;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,122,26,.22);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .wa-door:hover, .wa-door:focus-visible {
    transform: translateY(-3px); border-color: #ff7a1a; outline: none;
    box-shadow: 0 16px 40px rgba(0,0,0,.55), 0 0 0 1px #ff7a1a, 0 0 30px -8px #ff7a1a;
  }
  .wa-door b { font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #f1f5fb; }
  .wa-door > span:nth-of-type(1) { grid-column: 1 / -1; grid-row: 2; font-size: 11.5px; color: #b7c3d4; max-width: 250px; line-height: 1.4; }
  .wa-count { grid-row: 1; grid-column: 2; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; justify-self: end; }
  .wa-go {
    grid-column: 1 / -1; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap;
    color: var(--muted); transition: color .2s ease; margin-top: 4px;
  }
  .wa-door:hover .wa-go { color: #ff7a1a; }
  @media (max-width: 1100px) {
    .wl-arena { grid-template-columns: 1fr 1fr; }
    .wl-arena svg { display: none; }
    .wa-name, .wa-text { grid-column: 1 / -1; }
  }
  @media (max-width: 640px) {
    .wl-arena { grid-template-columns: minmax(0, 1fr); padding: 14px; }
    .wl-arena svg { display: none; }
  }
  /* Size the plant: the same strip in cyan, one link rather than doors */
  .wl-arena.wl-size {
    margin-top: 0; grid-template-columns: auto auto minmax(0, 1fr) auto; text-decoration: none;
    background: linear-gradient(90deg, rgba(53,224,208,.12), rgba(10,15,23,.86) 40%);
    border-color: rgba(53,224,208,.3);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .wl-arena.wl-size:hover, .wl-arena.wl-size:focus-visible {
    transform: translateY(-3px); border-color: var(--cyan); outline: none;
    box-shadow: 0 16px 40px rgba(0,0,0,.55), 0 0 0 1px var(--cyan), 0 0 30px -8px var(--cyan);
  }
  .wl-size .wa-name em, .wl-arena.wl-size:hover .wa-go { color: var(--cyan); }
  .wl-size .wa-go { grid-column: auto; margin-top: 0; padding-right: 8px; }
  @media (max-width: 1100px) {
    .wl-arena.wl-size { grid-template-columns: minmax(0, 1fr) auto; }
    .wl-size .wa-name, .wl-size .wa-text { grid-column: 1; }
    .wl-size .wa-go { grid-column: 2; grid-row: 1 / 3; }
  }
  @media (max-width: 640px) {
    .wl-arena.wl-size { grid-template-columns: minmax(0, 1fr); }
    .wl-size .wa-go { grid-column: 1; grid-row: auto; }
  }
  #welcome footer {
    position: relative; display: flex; flex-wrap: wrap; justify-content: center;
    align-items: center; gap: 22px; font-size: 12px; color: var(--muted);
  }
  .wl-intro { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #c8d3e2; }
  .wl-intro input { accent-color: var(--cyan); width: 15px; height: 15px; }
  #welcome kbd {
    font-family: var(--mono); font-size: 10.5px; padding: 1px 5px; border-radius: 4px;
    border: 1px solid rgba(139,155,176,.3); color: #c8d3e2;
  }

  /* =============================================================== cutscene */
  #cutscene { position: fixed; inset: 0; z-index: 40; cursor: pointer; user-select: none; }
  .cs-bar {
    position: absolute; left: 0; right: 0; height: 0; background: #000;
    transition: height .9s cubic-bezier(.2,.8,.2,1);
  }
  .cs-bar.top { top: 0; }
  .cs-bar.bot { bottom: 0; }
  #cutscene.on .cs-bar { height: 11vh; }
  #cutscene.off .cs-bar { height: 0; transition-duration: .7s; }
  .cs-black {
    position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none;
    transition: opacity .25s ease; display: flex; align-items: center; justify-content: center;
  }
  .cs-black.on { opacity: 1; }
  .cs-black.card { transition-duration: .6s; }
  .cs-cap {
    position: absolute; left: 7vw; bottom: calc(11vh + 4vh); max-width: min(760px, 70vw);
    text-shadow: 0 2px 18px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9);
    opacity: 0; transition: opacity .8s ease .3s;
  }
  #cutscene.on .cs-cap { opacity: 1; }
  #cutscene.off .cs-cap, #cutscene.off .cs-skip, #cutscene.off .cs-dots, #cutscene.off .cs-place { opacity: 0; transition: opacity .3s; }
  .cs-kicker {
    font-family: var(--mono); font-size: 13px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px; min-height: 1em;
  }
  .cs-title {
    font-size: clamp(30px, 4.4vw, 58px); font-weight: 250; letter-spacing: -.015em;
    color: #fff; line-height: 1.05; margin-bottom: 14px; display: none;
  }
  #cutscene.has-title .cs-title { display: block; }
  .cs-text { font-size: clamp(15px, 1.35vw, 20px); line-height: 1.55; color: #e8eef6; font-weight: 350; min-height: 3em; }
  .cs-skip {
    position: absolute; right: 3vw; top: calc(11vh + 2.4vh);
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    background: rgba(0,0,0,.35); border-color: rgba(255,255,255,.25); color: #dfe6ef;
  }
  .cs-skip:hover { border-color: var(--accent); color: var(--accent); }
  .cs-dots { position: absolute; right: 3vw; bottom: calc(11vh + 4.5vh); display: flex; gap: 6px; }
  .cs-dots i { width: 22px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.2); }
  .cs-dots i.on { background: var(--accent); }
  .cs-place {
    position: absolute; left: 7vw; top: calc(11vh + 2.6vh);
    font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(255,255,255,.55);
  }
  .cs-obj { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 820px; padding: 0 6vw; }
  .cs-obj em {
    font-style: normal; font-family: var(--mono); font-size: 12px; letter-spacing: .32em;
    text-transform: uppercase; color: var(--accent);
  }
  .cs-obj b { font-size: clamp(22px, 2.6vw, 36px); font-weight: 400; color: #fff; line-height: 1.3; }
  .cs-obj span { font-size: 13px; color: var(--muted); }

  /* ---------------- walking ---------------- */
  /* on foot, the side console gets out of the way: the unit you are looking
     at and the numbers along the bottom are all that stay */
  #ui.walking > :not(#inspect):not(#kpis) { display: none !important; }
  #walk { position: fixed; inset: 0; pointer-events: none; display: none; }
  #walk.on { display: block; }
  #walk .cross {
    position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: rgba(230, 240, 250, .85); box-shadow: 0 0 0 1px rgba(0, 0, 0, .5);
  }
  #walk .cross.aim { width: 14px; height: 14px; margin: -7px 0 0 -7px; background: none; border: 2px solid var(--accent); }
  #walk .prompt {
    position: absolute; left: 50%; top: calc(50% + 22px); transform: translateX(-50%);
    font-size: 12px; color: var(--txt); white-space: nowrap; padding: 5px 11px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line-soft); opacity: 0; transition: opacity .15s;
  }
  #walk .prompt.show { opacity: 1; }
  #walk kbd, #walk .card kbd {
    font-family: var(--mono); font-size: 10px; background: #1a2532;
    border: 1px solid var(--line-soft); border-radius: 4px; padding: 1px 5px; margin: 0 2px; color: var(--txt);
  }
  #walk .keys {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    font-size: 11px; color: var(--muted); padding: 7px 14px; white-space: nowrap;
    background: var(--panel); border: 1px solid var(--line-soft); border-radius: 20px;
  }
  #walk .note {
    position: absolute; left: 50%; top: 58px; transform: translateX(-50%);
    font-size: 13px; color: var(--accent); letter-spacing: .04em; opacity: 0; transition: opacity .6s;
    text-shadow: 0 1px 8px #000;
  }
  #walk .note.show { opacity: 1; }
  #walk .card {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    pointer-events: auto; display: none; text-align: center; padding: 22px 26px; min-width: 300px;
    background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px;
  }
  #walk.paused .card { display: block; }
  #walk.paused .cross, #walk.paused .prompt { display: none; }
  #walk .card b { display: block; font-size: 15px; letter-spacing: .14em; color: var(--accent); margin-bottom: 6px; }
  #walk .card p { margin: 0 0 16px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  #walk .card .row { display: flex; gap: 10px; justify-content: center; }
  #walk .card button { padding: 8px 16px; }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="ui"></div>
  <div id="banner"></div>
  <div id="walk"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
